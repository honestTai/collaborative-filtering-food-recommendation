<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>美食推荐系统</title>
  {% load static %}
  <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css"> <!-- 引入 Bootstrap Icons -->
  <link href="{% static 'css/login.css' %}" rel="stylesheet"> <!-- 引入自定义 CSS -->
</head>
<body>

  <h2 class="page-title">美食推荐系统</h2>

  <div class="container">
    <h3 class="title">登录</h3>
    <form id="loginForm">
      <div class="mb-3">
        <label for="username" class="form-label">用户名</label>
        <input type="text" class="form-control" id="username" placeholder="输入您的用户名" required>
      </div>
      
      <div class="mb-3">
        <label for="password" class="form-label">密码</label>
        <input type="password" class="form-control" id="password" placeholder="输入您的密码" required>
      </div>

      <div class="mb-3 form-check">
        <input type="checkbox" class="form-check-input" id="remember">
        <label class="form-check-label" for="remember">记住我</label>
      </div>

      <button type="submit" class="btn btn-primary w-100">登录</button>
    </form>

    <div class="text-center mt-3 register-link">
      <span>还没有账号？</span> <a href="{% url 'register' %}">注册</a>
      <span class="mx-2">|</span>
      <a href="#"><i class="bi bi-lock"></i> 忘记密码？</a>
    </div>
  </div>

  <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
  <script>
    const csrfToken = '{{ csrf_token }}';  // 将 CSRF 令牌存储在变量中

    document.getElementById("loginForm").addEventListener("submit", function(event) {
      event.preventDefault();

      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;

      // 显示加载状态
      const loginButton = event.target.querySelector('button[type="submit"]');
      loginButton.textContent = '登录中...'; // 更新按钮文本
      loginButton.disabled = true; // 禁用按钮

      fetch('/myapp/login/', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-CSRFToken': csrfToken
        },
        body: JSON.stringify({
          'username': username,
          'password': password
        })
      })
      .then(response => response.json())
      .then(data => {
        loginButton.textContent = '登录'; // 恢复按钮文本
        loginButton.disabled = false; // 启用按钮

        if (data.success) {
          alert(data.message);
          window.location.href = "/myapp/index";
        } else {
          alert(data.message);
        }
      })
      .catch(error => {
        loginButton.textContent = '登录'; // 恢复按钮文本
        loginButton.disabled = false; // 启用按钮
        alert("登录失败，请稍后重试！");
      });
    });
  </script>
</body>
</html>
